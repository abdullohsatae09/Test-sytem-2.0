<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองหัตถการ รพ.สต.บ้านป่ายาง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-emerald-100">
        <div class="bg-emerald-700 p-6 text-center text-white">
            <h1 class="text-xl font-bold">🍃 จองคิวนวดแพทย์แผนไทย</h1>
            <p class="text-sm opacity-80">รพ.สต.บ้านป่ายาง</p>
        </div>
        
        <div class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-semibold text-emerald-900 mb-2">1. เลือกวันที่ต้องการ:</label>
                <input type="date" id="dateInput" onchange="checkAvailability()" class="w-full p-3 border-2 border-emerald-50 rounded-xl focus:border-emerald-500 outline-none transition-all">
            </div>

            <div class="grid grid-cols-1 gap-3">
                <label class="block text-sm font-semibold text-emerald-900">2. ข้อมูลผู้ติดต่อ:</label>
                <input type="text" id="userName" placeholder="ชื่อ-นามสกุล" class="w-full p-3 border-2 border-emerald-50 rounded-xl outline-none focus:border-emerald-500">
                <input type="tel" id="userPhone" placeholder="เบอร์โทรศัพท์" class="w-full p-3 border-2 border-emerald-50 rounded-xl outline-none focus:border-emerald-500">
            </div>

            <div id="timeSection" class="hidden animate-fade-in">
                <label class="block text-sm font-semibold text-emerald-900 mb-3 border-t pt-4">3. เลือกเวลาที่ว่าง:</label>
                <div id="slotsGrid" class="grid grid-cols-1 gap-2">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // *** ใส่ URL ของคุณที่ได้จาก Google Apps Script ตรงนี้ ***
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby38b5qC-4yYuol44koNO-E8dDBJmvmLxpc6jW9ANo5hImIKJ-QNRdMJWTIqV6gdes5/exec";
        
        const allSlots = ["09:00 - 10:00", "10:00 - 11:00", "13:30 - 14:30", "14:30 - 15:30", "15:30 - 16:30"];

        async function checkAvailability() {
            const date = document.getElementById('dateInput').value;
            if(!date) return;

            const grid = document.getElementById('slotsGrid');
            document.getElementById('timeSection').classList.remove('hidden');
            grid.innerHTML = "<div class='text-center py-4'><span class='text-emerald-600 animate-pulse'>🔍 กำลังตรวจสอบคิวว่าง...</span></div>";

            try {
                const response = await fetch(`${SCRIPT_URL}?date=${date}`);
                const bookedSlots = await response.json();

                grid.innerHTML = "";
                allSlots.forEach(slot => {
                    const isBooked = bookedSlots.includes(slot);
                    const btn = document.createElement('button');
                    btn.className = `p-4 rounded-2xl border-2 text-center transition-all font-semibold ${
                        isBooked ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed' 
                                 : 'bg-emerald-50 text-emerald-700 border-emerald-100 hover:bg-emerald-600 hover:text-white hover:scale-[1.02]'
                    }`;
                    btn.innerText = isBooked ? `${slot} (เต็มแล้ว)` : slot;
                    btn.disabled = isBooked;
                    
                    if(!isBooked) btn.onclick = () => submitBooking(slot);
                    grid.appendChild(btn);
                });
            } catch (e) {
                grid.innerHTML = "<p class='text-red-500 text-center'>เชื่อมต่อล้มเหลว กรุณาลองใหม่</p>";
            }
        }

        async function submitBooking(time) {
            const date = document.getElementById('dateInput').value;
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;

            if(!name || !phone) {
                alert("⚠️ กรุณากรอกชื่อและเบอร์โทรศัพท์ก่อนครับ");
                return;
            }

            if(!confirm(`ยืนยันการจองวันที่ ${date} เวลา ${time}`)) return;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ date, time, name, phone })
                });
                const res = await response.json();
                
                if(res.status === "success") {
                    alert("✅ จองสำเร็จ! ข้อมูลบันทึกเรียบร้อยแล้ว");
                    location.reload();
                } else if(res.status === "full") {
                    alert("❌ ขออภัย! เวลานี้เพิ่งถูกจองไปเมื่อครู่ กรุณาเลือกเวลาอื่น");
                    checkAvailability();
                }
            } catch (e) {
                alert("❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
            }
        }
    </script>
</body>
</html>
