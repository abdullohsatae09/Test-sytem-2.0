<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบนัดหมายแพทย์แผนไทย รพ.สต.บ้านป่ายาง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border-t-8 border-emerald-600">
        <div class="bg-emerald-600 p-8 text-center text-white">
            <h1 class="text-2xl font-bold">🍃 นัดหมายจองคิว</h1>
            <p class="opacity-90">รพ.สต.บ้านป่ายาง จ.นครศรีธรรมราช</p>
        </div>

        <div class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-2">1. เลือกวันที่:</label>
                <input type="date" id="dateInput" onchange="checkAvailability()" class="w-full p-4 border-2 border-emerald-50 rounded-2xl outline-none focus:border-emerald-500 transition-all">
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-bold text-gray-600">2. ข้อมูลผู้จอง:</label>
                <input type="text" id="userName" placeholder="ชื่อ-นามสกุล" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="tel" id="userPhone" placeholder="เบอร์โทรศัพท์" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div id="timeSection" class="hidden border-t pt-5">
                <label class="block text-sm font-bold text-gray-600 mb-4">3. เลือกเวลาที่ว่าง:</label>
                <div id="slotsGrid" class="grid grid-cols-1 gap-3"></div>
            </div>
        </div>
    </div>

    <!-- หน้ากากกันกดซ้ำขณะรอระบบบันทึก -->
    <div id="loading" class="fixed inset-0 bg-black/60 hidden flex flex-col items-center justify-center text-white z-50">
        <div class="animate-spin rounded-full h-14 w-14 border-4 border-white border-t-transparent mb-4"></div>
        <p class="text-lg">กำลังตรวจสอบและบันทึกคิว...</p>
    </div>

    <script>
        // --- ก๊อปปี้ URL ที่ได้จากการ Deploy มาวางตรงนี้ ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby38b5qC-4yYuol44koNO-E8dDBJmvmLxpc6jW9ANo5hImIKJ-QNRdMJWTIqV6gdes5/exec"; 
        
        const allSlots = ["09:00 - 10:00", "10:00 - 11:00", "13:30 - 14:30", "14:30 - 15:30", "15:30 - 16:30"];

        async function checkAvailability() {
            const date = document.getElementById('dateInput').value;
            if(!date) return;
            const grid = document.getElementById('slotsGrid');
            const section = document.getElementById('timeSection');
            section.classList.remove('hidden');
            grid.innerHTML = "<p class='text-center py-4 text-emerald-600 animate-pulse'>🔍 กำลังตรวจสอบคิวว่าง...</p>";

            try {
                const response = await fetch(`${SCRIPT_URL}?date=${date}`);
                const bookedSlots = await response.json();
                grid.innerHTML = "";
                allSlots.forEach(slot => {
                    const isBooked = bookedSlots.includes(slot.trim());
                    const btn = document.createElement('button');
                    btn.className = `p-4 rounded-2xl border-2 text-center transition-all font-semibold ${
                        isBooked ? 'bg-gray-100 text-gray-400 border-gray-100 cursor-not-allowed' 
                                 : 'bg-white text-emerald-700 border-emerald-100 hover:bg-emerald-600 hover:text-white hover:shadow-lg'
                    }`;
                    btn.innerText = isBooked ? `${slot} (เต็มแล้ว)` : slot;
                    btn.disabled = isBooked;
                    if(!isBooked) btn.onclick = () => submitBooking(slot);
                    grid.appendChild(btn);
                });
            } catch (e) {
                grid.innerHTML = "<p class='text-red-500 text-center'>ขออภัย! การเชื่อมต่อขัดข้อง</p>";
            }
        }

        async function submitBooking(time) {
            const date = document.getElementById('dateInput').value;
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();

            if(!name || !phone) return alert("⚠️ กรุณากรอกข้อมูลให้ครบถ้วนครับ");
            if(!confirm(`ยืนยันการนัดหมาย\nวันที่: ${date}\nเวลา: ${time}`)) return;

            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ date, time, name, phone })
                });
                const res = await response.json();
                
                if(res.status === "success") {
                    alert("✅ นัดหมายสำเร็จเรียบร้อยแล้ว!");
                    location.reload();
                } else if(res.status === "full") {
                    alert("❌ ขออภัย! เวลานี้เพิ่งมีคนจองตัดหน้าไป กรุณาเลือกเวลาอื่นครับ");
                    checkAvailability();
                }
            } catch (e) {
                alert("❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
